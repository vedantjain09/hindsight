[project]
name = "hindsight"
version = "0.1.0"
description = "Counterfactual credit assignment for long-horizon agent trajectories"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "fastapi", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "httpx"]
train = ["torch", "transformers", "peft", "datasets", "accelerate"]

[project.scripts]
hindsight = "hindsight.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
